version: '3.9'
services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ./apps/frontend:/app
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
      - APP_ENV=development
    volumes:
      - ./apps/backend:/app
