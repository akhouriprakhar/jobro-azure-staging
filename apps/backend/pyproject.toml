[project]
name = "jobro-backend"
version = "0.1.0"
description = "FastAPI gateway for JOBRO enterprise AI interview intelligence platform"
authors = ["JOBRO Team <team@jobro.ai>"]
readme = "README.md"
requires-python = ">=3.12"

[project.dependencies]
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.23.2" }
pydantic = "^2.8.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.1.0"
python-multipart = "^0.0.6"
requests = "^2.31.0"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
